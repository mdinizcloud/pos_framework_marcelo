schema: spec-driven
context: >-
  [PAPEL DOS DOCS] Convenção: docs/prd/<NNN>-PRD-<slug>.md, docs/tdr/<NNN>.<M>-TDR-<slug-servico>.md, docs/adr/<NNN>.<M>-ADR-<slug>.md (numeração hierárquica por escopo — NNN do PRD, M compartilhado entre TDR/ADR do mesmo escopo; layout legado docs/sdd/ com TRD equivale ao mesmo papel). TDR = verdade técnica global por serviço (stack · arquitetura · RNFs · índice de ADRs) — consultar, não reescrever. ADRs = decisões imutáveis (status: aceito) — referenciar, nunca reabrir. PRDs = comportamento esperado e critério de aceite — fonte do que implementar.
  [IDIOMA] Nunca misturar inglês em prosa de nenhum artefato (proposal/specs/tasks/design): SHALL/SHALL NOT/WHEN/THEN sempre viram **DEVE**/**NÃO DEVE**/**QUANDO**/**ENTÃO** (maiúsculo, negrito), em qualquer lugar do texto, não só dentro de blocos formais de Scenario. Vale pra todo artefato, não só specs.

rules:
  proposal:
    - Incluir plano de rollback e mapear blast radius
    - Sinalizar impacto em disponibilidade / HA
    - "Títulos de seção sempre em português, nunca em inglês — traduzir: 'Why' → 'Por Quê', 'What Changes' → 'O Que Muda', 'Impact' → 'Impacto', 'Capabilities' → 'Capacidades', 'Modified Capabilities' → 'Capacidades Modificadas', 'New Capabilities' → 'Capacidades Novas'. Revisar o proposal.md inteiro antes de salvar procurando header residual em inglês."
  specs:
    - Cobrir cenários de falha e borda, não só o caminho feliz
    - Mapear o PRD de origem e os predicados cobertos
    - Incluir cenário de rollback/reversão quando a capacidade alterada tiver blast radius sinalizado no proposal — não só "falha e borda", também "e se precisar desfazer"
    - "Nunca usar os marcadores EARS em inglês (WHEN, THEN, SHALL, SHALL NOT) — sempre em português, MAIÚSCULO e em **negrito**: **QUANDO** (nunca WHEN), **ENTÃO** (nunca THEN), **DEVE** (nunca SHALL), **NÃO DEVE** (nunca SHALL NOT). Vale em qualquer lugar do spec — título de Requirement, corpo do texto, título de Scenario — não só dentro dos bullets de cenário."
    - "Exemplo correto: 'O sistema **DEVE** criar os registros...' e '- **QUANDO** o processo é executado' / '- **ENTÃO** os registros são criados'. Nunca misturar: revisar o spec inteiro antes de salvar procurando por WHEN/THEN/SHALL/SHALL NOT residual em inglês."
    - "Exceção só pro parser: a CLI do openspec (`openspec validate`) exige a palavra literal SHALL ou MUST em todo requirement ADDED/MODIFIED, senão rejeita o change inteiro (`must contain SHALL or MUST`). Pra satisfazer o parser sem violar a regra de idioma acima: todo requirement termina a frase descritiva (antes do primeiro Scenario) com um comentário HTML invisível mapeando o marcador — `<!-- DEVE = SHALL -->` ou `<!-- NÃO DEVE = SHALL NOT -->`. O texto visível continua 100% em português; o comentário existe só pra satisfazer o validador. Rodar `openspec validate <change> --strict` antes de considerar os specs prontos e confirmar que passa."
    - "Título de seção 'Purpose' → 'Propósito', sempre em português. EXCEÇÃO: 'ADDED Requirements', 'MODIFIED Requirements', 'REMOVED Requirements', 'RENAMED Requirements' ficam em inglês, sem tradução — são marcador estrutural que a CLI do openspec usa pra calcular delta de spec (archive/apply); traduzir esses 4 quebra o parser da ferramenta."
  tasks:
    - Cada task com comando de validação explícito
    - Incluir uma task de verificação (gate) antes de prosseguir
    - "Títulos de seção sempre em português, nunca em inglês — traduzir: 'Testing' → 'Testes', 'Rollout' → 'Lançamento', 'Rollback' → 'Rollback' (manter, é termo técnico), 'Dependencies' → 'Dependências'. Revisar o tasks.md inteiro antes de salvar procurando header residual em inglês."
  design:
    - "Na seção 'Decisões', numere cada decisão sequencialmente como D1, D2, D3... (ex.: '**D1 — Título curto.** texto')"
    - "Na seção 'Riscos / Compensações', numere cada item sequencialmente como R1, R2, R3... (ex.: '**R1** — Risco → Mitigação')"
    - "Na seção 'Plano de Migração', numere cada item sequencialmente como M1, M2, M3... (ex.: '**M1** — Migração')"
    - Ancorar decisões nos ADRs aceitos e no TDR, sem reabrir ADR
    - "Títulos de seção sempre em português, nunca em inglês — traduzir: 'Context' → 'Contexto', 'Goals / Non-Goals' → 'Objetivos / Não-Objetivos', 'Decisions' → 'Decisões', 'Risks / Trade-offs' → 'Riscos / Compensações', 'Open Questions' → 'Perguntas em Aberto'. Vale também pros sub-rótulos em negrito dentro da seção, não só o header: '**Goals:**' → '**Objetivos:**', '**Non-Goals:**' → '**Não-objetivos:**'. Revisar o design.md inteiro antes de salvar procurando header ou rótulo residual em inglês."

operations:
  apply:
    guidance:
      - Confirmar `openspec validate <change> --strict` passando antes de aplicar qualquer change
      - Ao aplicar change que introduz ADR novo, atualizar o índice de ADRs no TDR correspondente (mesmo escopo M) antes de considerar o apply concluído
  archive:
    guidance:
      - Resumir o resultado do archive (o que mudou, specs afetados) antes de finalizar
      - Se o change arquivado criou ou modificou ADR, confirmar que o índice de ADRs no TDR já reflete o estado final antes de arquivar

# Template canônico — agnóstico ao projeto alvo.
# Ao copiar pra um projeto, o único campo que varia é `context`: acrescente
# UMA linha própria (ex.: "[PROJETO] <domínio, stack, arquitetura>") acima de
# [PAPEL DOS DOCS]. `rules` e `operations` são o padrão comum a todos os repos
# e são propagados pela skill openspec-conf-sync.
